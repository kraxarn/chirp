name: Emscripten

on: [ push, pull_request ]

env:
  BUILD_TYPE: MinSizeRel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 'latest'

      - name: Configure CMake
        run: emcmake cmake -S . -B build -D CMAKE_BUILD_TYPE=$BUILD_TYPE -D SDL_PTHREADS=ON

      - name: Build
        run: cmake --build build --target chirp3d

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chirp3d-wasm
          path: |
            ${{runner.workspace}}/chirp/build/engine3d
