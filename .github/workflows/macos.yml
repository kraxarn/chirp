name: macOS

on: [ push, pull_request ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: '${{ matrix.arch }}'
    runs-on: macos-latest

    strategy:
      matrix:
        include:
          - arch: x86_64
          - arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build -D CMAKE_BUILD_TYPE=$BUILD_TYPE -D ENABLE_WARNINGS_AS_ERRORS=ON -D CMAKE_OSX_DEPLOYMENT_TARGET="10.14" -D CMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"

      - name: Build
        run: cmake --build build --target chirp3d chirp_tests

      - name: Test
        run: ctest --extra-verbose --test-dir build/tests

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chirp3d-macos-${{ matrix.arch }}
          path: ${{runner.workspace}}/chirp/build/engine3d/chirp3d.app
